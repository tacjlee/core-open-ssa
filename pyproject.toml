[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-open-ssa"
version = "0.24.12.12"
description = "OpenSSA: Small Specialist Agents for Industrial AI (vendored core-open-ssa build; import namespace `openssa`)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aitomatic, Inc.", email = "engineering@aitomatic.com" },
]
keywords = [
    "Artificial Intelligence", "A.I.", "AI",
    "industrial", "specialist", "specialized",
    "domain", "expertise", "knowledge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "adlfs>=2024.7",
    "certifi>2024.12",
    "docx2txt>=0.8",
    "fsspec>=2024.10",
    "gcsfs>=2024.10",
    "google-api-python-client>=2.155",
    "googlesearch-python>=1.2",
    "httpx>=0.28",
    "huggingface-hub>=0.26",
    "llama-index>=0.12",
    "llama-index-embeddings-azure-openai>=0.3",
    "llama-index-llms-azure-openai>=0.3",
    "llama-index-readers-web>=0.3",
    "loguru>=0.7",
    "openai>=1.57",
    "pycryptodome>=3.21",
    "pydantic>=2.10",
    "pypdf>=5.1",
    "python-dotenv>=1.0",
    "s3fs>=2024.10",
    "tqdm>=4.67",
]

[project.optional-dependencies]
contrib = [
    "streamlit>=1.41",
    "streamlit-extras>=0.5",
    "streamlit-mic-recorder>=0.0.8",
]
langchain = [
    "langchainhub>=0.1",
    "faiss-cpu>=1.9",
]

[project.urls]
Homepage = "https://openssa.org"
Repository = "https://github.com/aitomatic/openssa"
Documentation = "https://aitomatic.github.io/openssa"

# The import namespace stays `openssa` (only the distribution is renamed to
# `core-open-ssa`), so existing `from openssa import ...` code works unchanged.
[tool.setuptools.packages.find]
where = ["."]
include = ["openssa*"]

# Ship the non-Python package data that lives inside the openssa tree
# (prompt templates, the contrib streamlit app assets, etc.).
[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.toml", "*.template", "Makefile"]
